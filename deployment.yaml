apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-maven-app
  labels:
    app: simple-maven-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-maven-app
  template:
    metadata:
      labels:
        app: simple-maven-app
    spec:
      containers:
        - name: simple-maven-app
          image: arnavsoni2007/simple-maven-app:latest
          imagePullPolicy: Always
          stdin: true
          tty: true
          command: ["java", "-jar", "/app/app.jar"]
